# Logging configuration
# Usage: import logging.config
#        logging.config.fileConfig('logging.ini')

[loggers]
keys=root,src

[handlers]
keys=console,file,file_debug

[formatters]
keys=standard,detailed

[logger_root]
level=INFO
handlers=console,file

[logger_src]
level=DEBUG
handlers=console,file,file_debug
qualname=src
propagate=0

[handler_console]
class=StreamHandler
level=INFO
formatter=standard
args=(sys.stdout,)

[handler_file]
class=FileHandler
level=INFO
formatter=standard
args=('artifacts/ml-pipeline.log', 'a', 'utf-8')

[handler_file_debug]
class=FileHandler
level=DEBUG
formatter=detailed
args=('artifacts/ml-pipeline-debug.log', 'a', 'utf-8')

[formatter_standard]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_detailed]
format=%(asctime)s - %(name)s - %(levelname)s - [%(filename)s:%(lineno)d] - %(funcName)s() - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
